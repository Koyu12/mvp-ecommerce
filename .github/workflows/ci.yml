name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Integration tests start PostgreSQL and Redis with Testcontainers on the runner's Docker.
      - run: pnpm test
      # The checkout E2E test (apps/e2e) needs the running stack and Midtrans sandbox keys, so it runs manually: see apps/e2e/README.md.
