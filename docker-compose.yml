services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
      POSTGRES_DB: store
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U store']
      interval: 2s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      retries: 15

  mailpit:
    image: axllent/mailpit:v1.34
    ports:
      - '1025:1025'
      - '8025:8025'

  # S3-compatible image storage; R2 stands in for it in production.
  # The official minio/minio images are no longer published, so this is pgsty's community build (it ships `mc` too).
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://localhost:9000/minio/health/live']
      interval: 2s
      retries: 15

  # Creates the images bucket once and makes it publicly readable, like the R2 bucket's public domain.
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 minioadmin minioadmin
      && mc mb --ignore-existing local/images
      && mc anonymous set download local/images"
    depends_on:
      minio:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgresql://store:store@postgres:5432/store
      REDIS_URL: redis://redis:6379
      SMTP_URL: smtp://mailpit:1025
      PORT: 3001
      # Local-only secret; set a real one anywhere else.
      BETTER_AUTH_SECRET: local-dev-secret-not-for-production-use
      BETTER_AUTH_URL: http://localhost:3000
      # From Google Cloud console; set in your shell or a root .env file.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # The browser uploads to and loads images from these URLs, so they use the published port, not minio:9000.
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: images
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      STORAGE_PUBLIC_URL: http://localhost:9000/images
      # Midtrans sandbox keys; set in your shell or a root .env file. Notifications reach the API through the web proxy.
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
    # No published port: browsers reach the API only through the web app's /api proxy (ADR 0001),
    # so the auth rate limits can't be skipped by calling the API directly.
    expose:
      - '3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      context: .
      target: web
      args:
        API_URL: http://api:3001
    environment:
      API_URL: http://api:3001
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  postgres-data:
  minio-data:
