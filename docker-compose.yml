services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
      POSTGRES_DB: store
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U store']
      interval: 2s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      retries: 15

  mailpit:
    image: axllent/mailpit:v1.34
    ports:
      - '1025:1025'
      - '8025:8025'

  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgresql://store:store@postgres:5432/store
      REDIS_URL: redis://redis:6379
      SMTP_URL: smtp://mailpit:1025
      PORT: 3001
      # Local-only secret; set a real one anywhere else.
      BETTER_AUTH_SECRET: local-dev-secret-not-for-production-use
      BETTER_AUTH_URL: http://localhost:3000
    # No published port: browsers reach the API only through the web app's /api proxy (ADR 0001),
    # so the auth rate limits can't be skipped by calling the API directly.
    expose:
      - '3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    build:
      context: .
      target: web
      args:
        API_URL: http://api:3001
    environment:
      API_URL: http://api:3001
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  postgres-data:
